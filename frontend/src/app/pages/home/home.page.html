<ion-header>
  <ion-toolbar>
    <ion-title>Tareas</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">Cerrar sesión</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>
    <ion-item *ngFor="let task of tasks"
      [ngClass]="{
        'completed': task.completed,
        'prioridad-alta': task.prioridad === 'alta' && !task.completed,
        'prioridad-media': task.prioridad === 'media' && !task.completed,
        'prioridad-baja': task.prioridad === 'baja' && !task.completed
        }">
      <ion-label [class.completed]="task.completed">
        <h2>{{ task.title }}</h2>
          <p>Categoría: {{ task.categoria || 'otros' }}</p>
          <p>Prioridad: {{ task.prioridad || 'media' }}</p>
      </ion-label>
      <ion-checkbox slot="end"
        [(ngModel)]="task.completed" (ionChange)="toggleTask(task)"></ion-checkbox>
      <ion-button color="danger" fill="clear" (click)="deleteTask(task)">
        <ion-icon name="trash"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
